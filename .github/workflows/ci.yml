name: QMoosa-PQS CI & Pages Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: "Automated Reality Verification Suite"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run QMoosa-PQS Master Test Runner
      run: |
        python tests/run_all_tests.py

    - name: Run BountyHunter OS Fail-Closed QPU Certification Gate
      continue-on-error: true
      run: |
        python tools/one-click-qpu-certify.py || true

    - name: Upload QPU Certification Evidence Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: qpu-certification-evidence
        path: artifacts/qpu-certification/

    - name: Report Commit Status Check
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        STATUS="${{ job.status }}"
        STATE="failure"
        if [ "$STATUS" = "success" ]; then
          STATE="success"
        fi
        gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
          -f state="$STATE" \
          -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          -f description="50/50 Reality Verifications Passed (NIST KAT, Hardware Provider Receipts, Fallback Honesty, Web4, Conway)" \
          -f context="QMoosa-PQS/Reality-Verification"

  deploy:
    name: "Deploy to GitHub Pages"
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true

    - name: Upload Web Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'web'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
