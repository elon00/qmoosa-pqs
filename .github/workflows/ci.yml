name: QMoosa-PQS CI & Pages Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: "Automated Reality Verification Suite"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Enforce provider TLS verification
      run: |
        python - <<'PY'
        from pathlib import Path
        forbidden = ("ssl.CERT_NONE", "check_hostname = False", "_create_unverified_context")
        offenders = []
        for path in Path(".").rglob("*.py"):
            text = path.read_text(encoding="utf-8", errors="ignore")
            for token in forbidden:
                if token in text:
                    offenders.append(f"{path}: {token}")
        if offenders:
            raise SystemExit("Unverified TLS is forbidden:\n" + "\n".join(offenders))
        print("TLS policy check passed")
        PY

    - name: Run QMoosa-PQS Master Test Runner
      run: |
        python tests/run_all_tests.py

    - name: Run QPU Certification Evidence Gate
      env:
        IBMQ_TOKEN: ${{ secrets.IBMQ_TOKEN }}
        ORIGIN_API_KEY: ${{ secrets.ORIGIN_API_KEY }}
      run: |
        if [ -z "$IBMQ_TOKEN" ] && [ -z "$ORIGIN_API_KEY" ]; then
          echo "Live-QPU provider credentials are not configured; certification remains BLOCKED, not failed."
          mkdir -p artifacts/qpu-certification
          printf '%s\n' '{"status":"BLOCKED","reason":"provider credentials not configured","live_qpu_verified":false}' > artifacts/qpu-certification/status.json
        else
          python tools/one-click-qpu-certify.py
        fi

    - name: Upload QPU Certification Evidence Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: qpu-certification-evidence
        path: artifacts/qpu-certification/

    - name: Report Commit Status Check
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        STATUS="${{ job.status }}"
        STATE="failure"
        DESCRIPTION="Reality verification failed; inspect CI evidence"
        if [ "$STATUS" = "success" ]; then
          STATE="success"
          DESCRIPTION="Repository verification passed; live-QPU status is evidence-dependent"
        fi
        gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
          -f state="$STATE" \
          -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          -f description="$DESCRIPTION" \
          -f context="QMoosa-PQS/Reality-Verification"

  deploy:
    name: "Deploy to GitHub Pages"
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true

    - name: Upload Web Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'web'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
